name: website Pages
run-name: ${{ inputs.release-version && format('release {0} from {1}/{2}', inputs.release-version, inputs.release-run-id, inputs.release-attempt) || github.workflow }}

on:
  push:
    branches: [main, 'codex/**']
    paths:
      - 'website/**'
      - 'package.json'
      - 'docs/usage.md'
      - 'scripts/npm-publish.mjs'
      - '.github/workflows/website-pages.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'package.json'
      - 'docs/usage.md'
      - 'scripts/npm-publish.mjs'
      - '.github/workflows/website-pages.yml'
  workflow_dispatch:
    inputs:
      release-version:
        description: 'Already promoted stable version; blank uses ordinary website routing'
        type: string
        default: ''
      release-run-id:
        description: 'Associated npm release run'
        type: string
        default: ''
      release-attempt:
        description: 'Associated npm release attempt'
        type: string
        default: ''
      verify-run-id:
        description: 'Recheck an existing website deployment without uploading; use the same branch and unchanged site files'
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: website-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  website:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      RELEASE_VERSION: ${{ inputs.release-version }}
      VERIFY_RUN_ID: ${{ inputs.verify-run-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Test deployment checks
        run: node --test ./website/publish.test.mjs
      - name: Check website version eligibility
        id: release
        run: node website/publish.mjs eligibility
      - name: Build npm installation site
        if: steps.release.outputs.build == 'true'
        run: node website/build.mjs
      - name: Check static output and public npm release
        id: publication
        if: steps.release.outputs.build == 'true' && inputs.verify-run-id == ''
        run: node website/publish.mjs check
      - name: Recover the original uploaded deployment for verification only
        id: recovered
        if: steps.release.outputs.build == 'true' && inputs.verify-run-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: node website/recover.mjs
      - name: Prepare Pages project
        id: prepare
        if: inputs.verify-run-id == '' && steps.publication.outputs.ready == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          GH_TOKEN: ${{ github.token }}
        run: node website/publish.mjs prepare
      - name: Recheck main immediately before upload
        if: steps.prepare.outputs.deploy == 'true' || steps.recovered.outputs.verify == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node website/publish.mjs current
      - name: Upload to Cloudflare Pages
        id: pages
        if: inputs.verify-run-id == '' && steps.prepare.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.146.0'
          packageManager: npm
          workingDirectory: ${{ steps.prepare.outputs.tool_directory }}
          command: >-
            pages deploy ${{ steps.prepare.outputs.site_directory }}
            --project-name=${{ steps.prepare.outputs.project }}
            --branch=${{ steps.prepare.outputs.branch }}
            --commit-hash=${{ github.sha }}
            --commit-dirty=true
      - name: Verify unique deployment URL
        if: steps.prepare.outputs.deploy == 'true' || steps.recovered.outputs.verify == 'true'
        env:
          PAGES_DEPLOYMENT_URL: ${{ steps.recovered.outputs.url || steps.pages.outputs.deployment-url }}
          PAGES_ENVIRONMENT: ${{ steps.recovered.outputs.environment || steps.pages.outputs.pages-environment }}
        run: node website/publish.mjs verify
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.prepare.outputs.deploy == 'true' || steps.recovered.outputs.verify == 'true'
        with:
          bun-version: '1.4.2'
      - if: steps.prepare.outputs.deploy == 'true' || steps.recovered.outputs.verify == 'true'
        run: bun install --frozen-lockfile
      - name: Verify deployed pages at desktop and mobile sizes
        if: steps.prepare.outputs.deploy == 'true' || steps.recovered.outputs.verify == 'true'
        run: |
          bunx playwright install --with-deps chromium
          node website/verify-live.mjs
      - name: Keep sanitized deployment evidence and file hashes in logs
        if: always()
        run: node scripts/report-evidence.mjs .dev-smoke/website-pages
