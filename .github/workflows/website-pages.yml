name: website Pages

on:
  push:
    branches: [main, 'codex/**']
    paths:
      - 'website/**'
      - 'package.json'
      - 'docs/usage.md'
      - 'scripts/npm-publish.mjs'
      - '.github/workflows/website-pages.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'package.json'
      - 'docs/usage.md'
      - 'scripts/npm-publish.mjs'
      - '.github/workflows/website-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  website:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Test deployment checks
        run: node --test ./website/publish.test.mjs
      - name: Build npm installation site
        run: node website/build.mjs
      - name: Check static output and public npm release
        run: node website/publish.mjs check
      - name: Prepare Pages project
        id: prepare
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          GH_TOKEN: ${{ github.token }}
        run: node website/publish.mjs prepare
      - name: Upload to Cloudflare Pages
        id: pages
        if: steps.prepare.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.146.0'
          packageManager: npm
          workingDirectory: ${{ steps.prepare.outputs.tool_directory }}
          command: >-
            pages deploy ${{ steps.prepare.outputs.site_directory }}
            --project-name=${{ steps.prepare.outputs.project }}
            --branch=${{ steps.prepare.outputs.branch }}
            --commit-hash=${{ github.sha }}
            --commit-dirty=true
      - name: Verify unique deployment URL
        if: steps.prepare.outputs.deploy == 'true'
        env:
          PAGES_DEPLOYMENT_URL: ${{ steps.pages.outputs.deployment-url }}
          PAGES_ENVIRONMENT: ${{ steps.pages.outputs.pages-environment }}
        run: node website/publish.mjs verify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: website-pages-evidence
          path: .dev-smoke/website-pages/*.json
          include-hidden-files: true
          overwrite: true
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-static
          path: dist/website/
          overwrite: true
          retention-days: 7
