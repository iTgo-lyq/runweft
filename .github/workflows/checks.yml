name: Development checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    # Same-repository codex branches already receive the push check.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.event.pull_request.head.ref, 'codex/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      selection: ${{ steps.scope.outputs.selection }}
      checks: ${{ steps.scope.outputs.checks }}
      core: ${{ steps.scope.outputs.core }}
      tools: ${{ steps.scope.outputs.tools }}
      kit: ${{ steps.scope.outputs.kit }}
      prototype: ${{ steps.scope.outputs.prototype }}
      integration: ${{ steps.scope.outputs.integration }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - id: scope
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.sha }}
          CI_DEFAULT_BRANCH: origin/${{ github.event.repository.default_branch }}
        run: node scripts/ci-scope.mjs
      - run: node scripts/check-workflow.mjs && node scripts/check-docs.mjs

  checks:
    needs: scope
    if: needs.scope.outputs.checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CODEX_HOME: ${{ github.workspace }}/.dev-smoke/ci-codex
      CLAUDE_CONFIG_DIR: ${{ github.workspace }}/.dev-smoke/ci-claude
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - if: fromJSON(needs.scope.outputs.selection).hapi
        run: git submodule update --init hapi && node scripts/check-docs.mjs
      - if: needs.scope.outputs.kit == 'true'
        run: node scripts/check-runweft-kit.mjs
      - if: fromJSON(needs.scope.outputs.selection).hapi
        run: bun install --frozen-lockfile
        working-directory: hapi
      - if: fromJSON(needs.scope.outputs.selection).clients
        run: |
          mkdir -p "$CODEX_HOME" "$CLAUDE_CONFIG_DIR"
          npm install --prefix .dev-smoke/native-tools --ignore-scripts --registry=https://registry.npmjs.org/ @openai/codex@0.159.2 @anthropic-ai/claude-code@2.1.283
          node .dev-smoke/native-tools/node_modules/@anthropic-ai/claude-code/install.cjs
          echo "$GITHUB_WORKSPACE/.dev-smoke/native-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - if: fromJSON(needs.scope.outputs.selection).typecheck
        run: bun run typecheck
      - if: needs.scope.outputs.core == 'true'
        run: bun run test
      - if: needs.scope.outputs.tools == 'true'
        run: bun run test:tools
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - if: fromJSON(needs.scope.outputs.selection).browser
        run: bunx playwright install --with-deps chromium
      - if: fromJSON(needs.scope.outputs.selection).build
        run: bun run build
      - name: Run selected integration files in one Bun process
        if: needs.scope.outputs.integration != '[]'
        env:
          SELECTION: ${{ needs.scope.outputs.selection }}
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          const scope = JSON.parse(process.env.SELECTION);
          const result = spawnSync('bun', ['run', 'test:integration', ...(scope.build ? ['--bin', 'dist/runweft'] : []), '--', ...scope.integration], { stdio: 'inherit' });
          process.exit(result.status ?? 1);
          NODE
      - name: Check pinned HAPI managers when their boundary changes
        if: fromJSON(needs.scope.outputs.selection).managers
        run: bunx vitest run src/runner/artifacts/manager.test.ts src/runner/repositories/manager.test.ts src/runner/workspaces/manager.test.ts
        working-directory: hapi/cli
      - name: Keep sanitized integration evidence in logs
        if: always()
        run: node scripts/report-evidence.mjs

  prototype:
    needs: scope
    if: needs.scope.outputs.prototype == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/prototype
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run build && bun run test

  result:
    needs: [scope, checks, prototype]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || !startsWith(github.event.pull_request.head.ref, 'codex/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - env:
          SCOPE: ${{ needs.scope.outputs.selection }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          import { verifyJobs } from './scripts/ci-scope.mjs';
          verifyJobs(JSON.parse(process.env.SCOPE), JSON.parse(process.env.RESULTS));
          NODE
