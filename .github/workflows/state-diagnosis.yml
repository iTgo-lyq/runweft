name: Native SQLite diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  state:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: true
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Diagnose fresh creation and private validation copy
        run: |
          mkdir -p .dev-smoke
          cat > .dev-smoke/state-diagnosis.ts <<'TS'
          import { Database } from 'bun:sqlite';
          import { chmodSync, copyFileSync, linkSync, mkdirSync, mkdtempSync, readdirSync, rmSync, writeFileSync } from 'node:fs';
          import { join, resolve } from 'node:path';
          import { openState, validateState } from '../src/state';
          const root = mkdtempSync(resolve('.dev-smoke/sqlite-diagnosis-'));
          function probe(name: string, action: () => void) {
            try { action(); console.log(JSON.stringify({name, success: true})); }
            catch(error: any) { console.log(JSON.stringify({name, success: false, message: error.message, errno: error.errno, code: error.code, stack: error.stack})); }
          }
          for (const method of ['disk', 'memory']) {
            const home = join(root, method), construction = join(home, 'construction'), path = join(home, 'state.sqlite');
            mkdirSync(construction, {recursive: true});
            const temporary = join(construction, 'state.sqlite');
            probe(method + ':construct', () => {
              const db = new Database(method === 'disk' ? temporary : ':memory:', {create: true});
              db.exec('CREATE TABLE keep(value TEXT); INSERT INTO keep VALUES (\'safe\');');
              if (method === 'memory') writeFileSync(temporary, db.serialize());
              db.close();
              console.log(JSON.stringify({method, files: readdirSync(construction)}));
              chmodSync(temporary, 0o600); linkSync(temporary, path); rmSync(construction, {recursive: true});
            });
            probe(method + ':open-readwrite', () => { const db = new Database(path, {readwrite: true, create: false}); db.query('SELECT * FROM keep').all(); db.close(); });
            const copy = join(home, 'copy.sqlite'); copyFileSync(path, copy);
            probe(method + ':open-readonly-copy', () => { const db = new Database(copy, {readonly: true}); db.query('SELECT * FROM keep').all(); db.close(); });
          }
          const path = join(root, 'actual', 'state.sqlite');
          probe('source:openState', () => { const db = openState(path); db.close(); });
          probe('source:validateState', () => validateState(path));
          console.log(JSON.stringify({platform: process.platform, architecture: process.arch, bun: Bun.version, sqlite: new Database(':memory:').query('SELECT sqlite_version() AS version').get()}));
          TS
          bun .dev-smoke/state-diagnosis.ts
      - name: Existing state preservation and concurrency regression
        run: bun test ./test/state.test.ts
