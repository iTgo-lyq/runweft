name: npm publishing

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release-tag:
        description: 'Existing immutable version tag to release/recover; leave all inputs blank for preflight'
        type: string
        default: ''
      source-run-id:
        description: 'Original beta run ID when recovering published packages with an updated workflow'
        type: string
        default: ''
      verify-run-id:
        description: 'Read-only public verification of an original release run; no upload, promotion or deployment'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  beta:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      CODEX_HOME: ${{ github.workspace }}/.dev-smoke/ci-codex
      CLAUDE_CONFIG_DIR: ${{ github.workspace }}/.dev-smoke/ci-claude
    outputs:
      release: ${{ steps.prepared.outputs.release || steps.published.outputs.release }}
      publish: ${{ steps.prepared.outputs.publish }}
      public-integration: ${{ steps.prepared.outputs.public-integration }}
      validation-mode: ${{ steps.prepared.outputs.validation-mode }}
      site-install: ${{ steps.prepared.outputs.site-install }}
      verify-only: ${{ steps.prepared.outputs.verify-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm install --global npm@11.21.0 --registry=https://registry.npmjs.org/ --ignore-scripts
      - name: Select immutable source or recover original public packages
        id: prepared
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release-tag }}
          SOURCE_RUN_ID: ${{ inputs.source-run-id }}
          VERIFY_RUN_ID: ${{ inputs.verify-run-id }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/npm-release.mjs prepare
      - name: Reserve release space with only the necessary hosted SDK cleanup
        if: steps.prepared.outputs.build == 'true'
        run: node scripts/release-space.mjs ensure
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.prepared.outputs.build == 'true'
        with:
          bun-version: '1.4.2'
      - if: steps.prepared.outputs.build == 'true'
        run: bun install --frozen-lockfile
      - if: steps.prepared.outputs.build == 'true'
        run: bun install --frozen-lockfile
        working-directory: hapi
      - name: Install native clients for configuration tests and discovery only
        if: steps.prepared.outputs.build == 'true'
        run: |
          mkdir -p "$CODEX_HOME" "$CLAUDE_CONFIG_DIR"
          npm install --prefix .dev-smoke/native-tools --ignore-scripts --registry=https://registry.npmjs.org/ @openai/codex@0.159.2 @anthropic-ai/claude-code@2.1.283
          node .dev-smoke/native-tools/node_modules/@anthropic-ai/claude-code/install.cjs
          .dev-smoke/native-tools/node_modules/.bin/codex --version
          .dev-smoke/native-tools/node_modules/.bin/claude --version
          echo "$GITHUB_WORKSPACE/.dev-smoke/native-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - if: steps.prepared.outputs.build == 'true'
        run: bun run typecheck && bun run test
      - if: steps.prepared.outputs.build == 'true'
        run: node --test ./scripts/tests/*.test.mjs ./website/publish.test.mjs
      - if: steps.prepared.outputs.build == 'true' && steps.prepared.outputs.public-integration != 'true'
        run: bunx playwright install --with-deps chromium
      - name: Check out exact tag source for packaging
        if: steps.prepared.outputs.build == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.prepared.outputs.source-ref }}
          path: .dev-smoke/release-source
          submodules: true
          persist-credentials: false
      - if: steps.prepared.outputs.build == 'true'
        run: bun install --frozen-lockfile
        working-directory: .dev-smoke/release-source
      - if: steps.prepared.outputs.build == 'true'
        run: bun install --frozen-lockfile
        working-directory: .dev-smoke/release-source/hapi
      - if: steps.prepared.outputs.build == 'true'
        run: node "$GITHUB_WORKSPACE/scripts/release-space.mjs" measure bun run package --all
        working-directory: .dev-smoke/release-source
      - name: Check every model-free integration group on the frozen candidate
        if: steps.prepared.outputs.build == 'true'
        env:
          RUNWEFT_SMOKE_PACKAGES: .dev-smoke/release-source/dist/packages
          INTEGRATION_GROUPS: ${{ steps.prepared.outputs.integration-groups }}
        run: |
          for group in $INTEGRATION_GROUPS; do
            node scripts/release-space.mjs measure bun scripts/smoke-integration.ts "$group" .dev-smoke/release-source/dist/packages/runweft-linux-x64/bin/runweft || exit $?
            df -h .
          done
      - name: Verify five package OIDC bindings
        if: steps.prepared.outputs.build == 'true' && steps.prepared.outputs.publish == 'true'
        run: node scripts/check-npm-trust.mjs
      - name: Preflight or upload exact tarballs to beta
        id: published
        if: steps.prepared.outputs.build == 'true'
        env:
          SOURCE_REVISION: ${{ steps.prepared.outputs.source-ref }}
          PUBLISH_RELEASE: ${{ steps.prepared.outputs.publish }}
          VERIFY_ONLY: ${{ steps.prepared.outputs.verify-only }}
        run: node scripts/npm-release.mjs beta
      - name: Keep sanitized validation in logs
        if: always()
        run: node scripts/report-evidence.mjs

  integration:
    needs: beta
    if: needs.beta.outputs.public-integration == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: access
            shard: 1/2
          - group: access
            shard: 2/2
          - group: storage
            shard: 1/3
          - group: storage
            shard: 2/3
          - group: storage
            shard: 3/3
          - group: web
            shard: 1/1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CODEX_HOME: ${{ github.workspace }}/.dev-smoke/ci-codex
      CLAUDE_CONFIG_DIR: ${{ github.workspace }}/.dev-smoke/ci-claude
      RELEASE_DESCRIPTOR: ${{ needs.beta.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: hapi
      - name: Install clients for configuration and discovery only
        run: |
          mkdir -p "$CODEX_HOME" "$CLAUDE_CONFIG_DIR"
          npm install --prefix .dev-smoke/native-tools --ignore-scripts --registry=https://registry.npmjs.org/ @openai/codex@0.159.2 @anthropic-ai/claude-code@2.1.283
          node .dev-smoke/native-tools/node_modules/@anthropic-ai/claude-code/install.cjs
          echo "$GITHUB_WORKSPACE/.dev-smoke/native-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - if: matrix.group == 'web'
        run: bunx playwright install --with-deps chromium
      - name: Download immutable public candidate
        id: candidate
        run: node scripts/npm-release.mjs download
      - name: Extract and verify both candidate programs
        id: programs
        env:
          CANDIDATE_DIRECTORY: ${{ steps.candidate.outputs.directory }}
        run: node scripts/npm-release.mjs unpack
      - name: Run selected integration group on the public candidate
        env:
          INTEGRATION_GROUP: ${{ matrix.group }}
          RUNWEFT_SMOKE_SHARD: ${{ matrix.shard }}
          CANDIDATE_BINARY: ${{ steps.programs.outputs.binary }}
        run: bun scripts/smoke-integration.ts "$INTEGRATION_GROUP" "$CANDIDATE_BINARY"
      - name: Keep sanitized integration evidence in logs
        if: always()
        run: node scripts/report-evidence.mjs

  install:
    needs: beta
    if: needs.beta.outputs.publish == 'true' || needs.beta.outputs.verify-only == 'true'
    uses: ./.github/workflows/cli-install.yml
    with:
      release: ${{ needs.beta.outputs.release }}
      site-install: ${{ needs.beta.outputs.site-install == 'true' }}

  promote:
    needs: [beta, install, integration]
    if: >-
      always() && needs.beta.outputs.verify-only != 'true' && needs.beta.result == 'success' && needs.install.result == 'success' &&
      ((needs.beta.outputs.validation-mode == 'public' && needs.integration.result == 'success') ||
      (needs.beta.outputs.validation-mode == 'inline' && needs.integration.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm install --global npm@11.21.0 --registry=https://registry.npmjs.org/ --ignore-scripts
      - name: Confirm five packages and promote platforms before main
        env:
          RELEASE_DESCRIPTOR: ${{ needs.beta.outputs.release }}
          INSTALL_RESULT: ${{ needs.install.result }}
          BETA_RESULT: ${{ needs.beta.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          VALIDATION_MODE: ${{ needs.beta.outputs.validation-mode }}
          VERIFY_ONLY: ${{ needs.beta.outputs.verify-only }}
        run: node scripts/npm-release.mjs promote

  website:
    if: inputs.verify-run-id == '' && (github.event_name == 'push' || inputs.release-tag != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    permissions:
      contents: read
      actions: write
    outputs:
      run-id: ${{ steps.website.outputs.run-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Dispatch stable website in parallel and wait for its actual result
        id: website
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release-tag }}
          VERIFY_RUN_ID: ${{ inputs.verify-run-id }}
        run: node scripts/release-finish.mjs website

  summary:
    needs: [beta, integration, install, promote, website]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Collect candidate, validation, retry and job timing evidence
        env:
          GH_TOKEN: ${{ github.token }}
          WEBSITE_RUN_ID: ${{ needs.website.outputs.run-id }}
          RELEASE_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/release-finish.mjs summary
