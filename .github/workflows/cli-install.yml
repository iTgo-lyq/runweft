name: CLI installation

on:
  workflow_call:
    inputs:
      release:
        type: string
        default: ''
      build:
        type: boolean
        default: false
      site-install:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-15
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: ${{ inputs.build }}
          fetch-depth: 0
      - name: Prepare this job’s private working directory
        run: node scripts/prepare-ci.mjs ${{ strategy.job-index }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - if: inputs.build
        run: bun install --frozen-lockfile
        working-directory: hapi
      - if: inputs.build
        run: |
          bun run package
          mkdir -p "$RUNWEFT_WORK_DIR"
          mv dist/packages "$RUNWEFT_WORK_DIR/candidate"
      - name: Download and verify public npm candidate
        if: ${{ !inputs.build }}
        id: candidate
        env:
          RELEASE_DESCRIPTOR: ${{ inputs.release }}
        run: node scripts/npm-release.mjs download
      - name: Verify both installation layouts and complete removal
        env:
          CANDIDATE_DIRECTORY: ${{ inputs.build && format('{0}/candidate', env.RUNWEFT_WORK_DIR) || steps.candidate.outputs.directory }}
        run: node test/acceptance/install.mjs --candidate "$CANDIDATE_DIRECTORY" --case all --report "$RUNWEFT_WORK_DIR/reports/install.json"
      - name: Verify stable website DOM installation and packaged instructions
        id: site
        if: matrix.platform == 'linux-x64' && inputs.site-install
        env:
          RELEASE_DESCRIPTOR: ${{ inputs.release }}
        run: |
          bunx playwright install --with-deps chromium
          node website/build.mjs
          node website/verify.mjs --report "$RUNWEFT_WORK_DIR/reports/website.json"
      - name: Keep sanitized installation evidence in logs
        if: always()
        env:
          SITE_CHECKED: ${{ steps.site.outcome != 'skipped' }}
        run: |
          reports=("$RUNWEFT_WORK_DIR/reports/install.json")
          if [ "$SITE_CHECKED" = true ]; then reports+=("$RUNWEFT_WORK_DIR/reports/website.json"); fi
          node scripts/report-evidence.mjs "${reports[@]}"
      - name: Remove successful job inputs
        if: success()
        run: rm -rf -- "$RUNWEFT_WORK_DIR"
