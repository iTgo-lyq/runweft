<html lang="zh-CN" data-theme="system">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>Runweft Hub · 交互原型</title><style>/* Runweft Hub prototype — quiet, content-first, blue accent, glass only on the floating control layer. */
:root {
  color-scheme: light;
  --canvas: #edf0f5;
  --surface: #ffffff;
  --surface-2: #f5f7fa;
  --surface-3: #eceff4;
  --ink: #141b26;
  --ink-2: #4b5768;
  --ink-3: #697486;
  --line: rgba(20, 27, 38, .08);
  --line-2: rgba(20, 27, 38, .15);
  --fill: rgba(20, 27, 38, .055);
  --fill-2: rgba(20, 27, 38, .09);
  --hover: rgba(20, 27, 38, .045);
  --menu-hover: rgba(20, 27, 38, .065);
  --field: #f6f7fa;
  --field-line: rgba(20, 27, 38, .14);
  --switch-off: #d3d9e2;
  --accent: #2b5fe3;
  --accent-fill: #2b5fe3;
  --accent-hover: #2452cc;
  --accent-ink: #1f4fc4;
  --accent-soft: rgba(43, 95, 227, .085);
  --accent-soft-2: rgba(43, 95, 227, .16);
  --ok: #157a4f; --ok-soft: rgba(21, 122, 79, .1);
  --warn: #975800; --warn-soft: rgba(219, 141, 0, .14);
  --danger: #bf3530; --danger-soft: rgba(191, 53, 48, .09);
  --unknown: #6a4cb5; --unknown-soft: rgba(106, 76, 181, .1);
  --neutral: #566173; --neutral-soft: rgba(86, 97, 115, .1);
  --thread: rgba(43, 95, 227, .45);
  --thread-quiet: rgba(20, 27, 38, .2);
  --wash-1: rgba(43, 95, 227, .11);
  --wash-2: rgba(110, 150, 255, .12);
  --scrim: rgba(14, 20, 32, .3);
  --focus: 0 0 0 2px var(--surface), 0 0 0 4px rgba(43, 95, 227, .6);
  --shadow-surface: 0 0 0 1px var(--line), 0 1px 2px rgba(20, 27, 38, .04), 0 10px 30px -18px rgba(20, 27, 38, .14);
  --shadow-panel: 0 0 0 1px var(--line), 0 10px 32px -18px rgba(20, 27, 38, .22);
  --shadow-card: 0 0 0 1px var(--line), 0 1px 2px rgba(20, 27, 38, .05), 0 18px 44px -20px rgba(20, 27, 38, .22);
  --shadow-sheet: 0 0 0 1px var(--line), 0 28px 70px -20px rgba(14, 20, 32, .4);
  --glass-bg: rgba(255, 255, 255, .64);
  --glass-tint: linear-gradient(180deg, rgba(255, 255, 255, .62), rgba(238, 243, 255, .32));
  --glass-edge: rgba(255, 255, 255, .78);
  --glass-highlight: rgba(255, 255, 255, .95);
  --glass-lowlight: rgba(20, 27, 38, .05);
  --glass-shadow: 0 1px 1px rgba(20, 27, 38, .04), 0 10px 28px -12px rgba(20, 27, 38, .22);
  --glass-blur: blur(22px) saturate(175%);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", system-ui, sans-serif;
  --font-display: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --toolbar: 48px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme=light]) { --dark: 1; } }
:root[data-theme=dark] { --dark: 1; }

/* Dark: surfaces are re-layered rather than inverted. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme=light]) {
    color-scheme: dark;
    --canvas: #0d1015; --surface: #161a21; --surface-2: #1c2129; --surface-3: #242a34;
    --ink: #e8ecf2; --ink-2: #a9b2c0; --ink-3: #848fa1;
    --line: rgba(255, 255, 255, .075); --line-2: rgba(255, 255, 255, .14);
    --fill: rgba(255, 255, 255, .065); --fill-2: rgba(255, 255, 255, .11); --hover: rgba(255, 255, 255, .05); --menu-hover: rgba(255, 255, 255, .08);
    --field: #1d222b; --field-line: rgba(255, 255, 255, .12); --switch-off: #3a414d;
    --accent: #6b97ff; --accent-fill: #3d6ff0; --accent-hover: #4f7ef5; --accent-ink: #94b4ff; --accent-soft: rgba(91, 140, 255, .14); --accent-soft-2: rgba(91, 140, 255, .24);
    --ok: #4cc38a; --ok-soft: rgba(76, 195, 138, .14); --warn: #f0b443; --warn-soft: rgba(240, 180, 67, .14);
    --danger: #ff746a; --danger-soft: rgba(255, 116, 106, .13); --unknown: #b9a3ff; --unknown-soft: rgba(185, 163, 255, .14); --neutral: #a9b2c0; --neutral-soft: rgba(169, 178, 192, .12);
    --thread: rgba(107, 151, 255, .55); --thread-quiet: rgba(255, 255, 255, .22);
    --wash-1: rgba(80, 125, 255, .14); --wash-2: rgba(60, 90, 210, .12); --scrim: rgba(0, 0, 0, .55);
    --focus: 0 0 0 2px var(--surface), 0 0 0 4px rgba(107, 151, 255, .75);
    --shadow-surface: 0 0 0 1px var(--line), 0 1px 2px rgba(0, 0, 0, .35);
    --shadow-panel: 0 0 0 1px var(--line-2), 0 16px 40px -18px rgba(0, 0, 0, .7);
    --shadow-card: 0 0 0 1px var(--line), 0 20px 50px -22px rgba(0, 0, 0, .8);
    --shadow-sheet: 0 0 0 1px var(--line-2), 0 28px 70px -18px rgba(0, 0, 0, .85);
    --glass-bg: rgba(30, 35, 44, .58); --glass-tint: linear-gradient(180deg, rgba(255, 255, 255, .07), rgba(255, 255, 255, .015));
    --glass-edge: rgba(255, 255, 255, .11); --glass-highlight: rgba(255, 255, 255, .1); --glass-lowlight: rgba(0, 0, 0, .35);
    --glass-shadow: 0 1px 1px rgba(0, 0, 0, .3), 0 12px 30px -12px rgba(0, 0, 0, .7);
  }
}
:root[data-theme=dark] {
  color-scheme: dark;
  --canvas: #0d1015; --surface: #161a21; --surface-2: #1c2129; --surface-3: #242a34;
  --ink: #e8ecf2; --ink-2: #a9b2c0; --ink-3: #848fa1;
  --line: rgba(255, 255, 255, .075); --line-2: rgba(255, 255, 255, .14);
  --fill: rgba(255, 255, 255, .065); --fill-2: rgba(255, 255, 255, .11); --hover: rgba(255, 255, 255, .05); --menu-hover: rgba(255, 255, 255, .08);
  --field: #1d222b; --field-line: rgba(255, 255, 255, .12); --switch-off: #3a414d;
  --accent: #6b97ff; --accent-fill: #3d6ff0; --accent-hover: #4f7ef5; --accent-ink: #94b4ff; --accent-soft: rgba(91, 140, 255, .14); --accent-soft-2: rgba(91, 140, 255, .24);
  --ok: #4cc38a; --ok-soft: rgba(76, 195, 138, .14); --warn: #f0b443; --warn-soft: rgba(240, 180, 67, .14);
  --danger: #ff746a; --danger-soft: rgba(255, 116, 106, .13); --unknown: #b9a3ff; --unknown-soft: rgba(185, 163, 255, .14); --neutral: #a9b2c0; --neutral-soft: rgba(169, 178, 192, .12);
  --thread: rgba(107, 151, 255, .55); --thread-quiet: rgba(255, 255, 255, .22);
  --wash-1: rgba(80, 125, 255, .14); --wash-2: rgba(60, 90, 210, .12); --scrim: rgba(0, 0, 0, .55);
  --focus: 0 0 0 2px var(--surface), 0 0 0 4px rgba(107, 151, 255, .75);
  --shadow-surface: 0 0 0 1px var(--line), 0 1px 2px rgba(0, 0, 0, .35);
  --shadow-panel: 0 0 0 1px var(--line-2), 0 16px 40px -18px rgba(0, 0, 0, .7);
  --shadow-card: 0 0 0 1px var(--line), 0 20px 50px -22px rgba(0, 0, 0, .8);
  --shadow-sheet: 0 0 0 1px var(--line-2), 0 28px 70px -18px rgba(0, 0, 0, .85);
  --glass-bg: rgba(30, 35, 44, .58); --glass-tint: linear-gradient(180deg, rgba(255, 255, 255, .07), rgba(255, 255, 255, .015));
  --glass-edge: rgba(255, 255, 255, .11); --glass-highlight: rgba(255, 255, 255, .1); --glass-lowlight: rgba(0, 0, 0, .35);
  --glass-shadow: 0 1px 1px rgba(0, 0, 0, .3), 0 12px 30px -12px rgba(0, 0, 0, .7);
}
/* Phones in dark mode use a true black canvas. */
@media (max-width: 760px) and (prefers-color-scheme: dark) { :root:not([data-theme=light]) { --canvas: #000; --surface: #000; --surface-2: #121419; --surface-3: #1b1e25; --field: #15181e; } }
@media (max-width: 760px) { :root[data-theme=dark] { --canvas: #000; --surface: #000; --surface-2: #121419; --surface-3: #1b1e25; --field: #15181e; } }

/* ---- base ---------------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; background: var(--canvas); color: var(--ink); font: 14px/1.6 var(--font); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { text-wrap: balance; }
p { text-wrap: pretty; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.icon { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.mark { width: 26px; height: 26px; flex: none; color: var(--accent-fill); }
.mono { font-family: var(--font-mono); font-size: .9em; overflow-wrap: anywhere; }
.muted { color: var(--ink-3); }
.hint { margin: 0; font-size: 12.5px; line-height: 1.6; color: var(--ink-3); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.skip { position: fixed; left: 12px; top: -60px; z-index: 100; padding: 8px 14px; border-radius: 10px; background: var(--surface); color: var(--ink); box-shadow: var(--shadow-card); }
.skip:focus { top: 12px; }

[data-tone=ok] { --tone: var(--ok); --tone-soft: var(--ok-soft); }
[data-tone=warn] { --tone: var(--warn); --tone-soft: var(--warn-soft); }
[data-tone=danger] { --tone: var(--danger); --tone-soft: var(--danger-soft); }
[data-tone=unknown] { --tone: var(--unknown); --tone-soft: var(--unknown-soft); }
[data-tone=accent], [data-tone=info] { --tone: var(--accent-ink); --tone-soft: var(--accent-soft); }
[data-tone=neutral], [data-tone=offline], [data-tone=lock] { --tone: var(--neutral); --tone-soft: var(--neutral-soft); }

/* ---- glass: only for controls that float above content ------------------------- */
.glass {
  background: var(--glass-tint), var(--glass-bg);
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-edge);
  box-shadow: inset 0 1px 0 var(--glass-highlight), inset 0 -1px 0 var(--glass-lowlight), var(--glass-shadow);
}
@supports not ((backdrop-filter: blur(2px)) or (-webkit-backdrop-filter: blur(2px))) { .glass { background: var(--surface); } }
@media (prefers-reduced-transparency: reduce) {
  .glass { background: var(--surface); -webkit-backdrop-filter: none; backdrop-filter: none; }
  dialog::backdrop { -webkit-backdrop-filter: none; backdrop-filter: none; }
}

/* ---- buttons ------------------------------------------------------------------- */
.btn { --h: 34px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: var(--h); padding: 0 14px; border: 0; border-radius: 10px; font-size: 13.5px; font-weight: 500; line-height: 1; white-space: nowrap; cursor: pointer; text-decoration: none; transition: background-color .15s, color .15s, box-shadow .15s, transform .08s; }
.btn .icon { width: 16px; height: 16px; }
.btn:focus-visible { outline: none; box-shadow: var(--focus); }
.btn:active:not(:disabled) { transform: translateY(.5px) scale(.985); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn[data-variant=primary] { background: var(--accent-fill); color: #fff; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2), 0 1px 2px rgba(20, 50, 140, .28); }
.btn[data-variant=primary]:hover:not(:disabled) { background: var(--accent-hover); }
.btn[data-variant=primary]:focus-visible { box-shadow: var(--focus); }
.btn[data-variant=secondary] { background: var(--fill); color: var(--ink); }
.btn[data-variant=secondary]:hover:not(:disabled) { background: var(--fill-2); }
.btn[data-variant=ghost] { background: transparent; color: var(--ink-2); }
.btn[data-variant=ghost]:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
.btn[data-variant=quiet] { background: transparent; color: var(--accent-ink); padding: 0 10px; }
.btn[data-variant=quiet]:hover:not(:disabled) { background: var(--accent-soft); }
.btn[data-variant=link] { --h: auto; background: none; padding: 2px 0; color: var(--accent-ink); font-weight: 500; }
.btn[data-variant=link]:hover { text-decoration: underline; text-underline-offset: 3px; }
.btn[data-variant=danger] { background: var(--danger-soft); color: var(--danger); }
.btn[data-variant=danger]:hover:not(:disabled) { background: color-mix(in srgb, var(--danger) 16%, transparent); }
.btn[data-size=sm] { --h: 30px; padding: 0 10px; font-size: 13px; border-radius: 9px; }
.btn[data-size=xs] { --h: 22px; padding: 0 4px; border-radius: 6px; }
.btn[data-size=xs] .icon { width: 13px; height: 13px; }
.btn[data-size=lg] { --h: 42px; padding: 0 18px; font-size: 15px; border-radius: 12px; }
.btn[data-icon-only=true] { width: var(--h); padding: 0; }
@media (pointer: coarse) {
  .btn { --h: 40px; }
  .btn[data-size=sm] { --h: 36px; }
  .btn[data-size=xs] { --h: 30px; }
}

/* ---- badges, tags, avatars ----------------------------------------------------- */
.badge { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 999px; background: var(--tone-soft, var(--fill)); color: var(--tone, var(--ink-2)); font-size: 12px; font-weight: 600; white-space: nowrap; vertical-align: middle; }
.badge .icon { width: 14px; height: 14px; margin-left: -2px; stroke-width: 1.9; }
.tag { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 999px; background: var(--fill); color: var(--ink-2); font-size: 12px; white-space: nowrap; }
.tag .icon { width: 13px; height: 13px; }
.tag[data-tone] { background: var(--tone-soft, var(--fill)); color: var(--tone, var(--ink-2)); }
.avatar { --size: 30px; display: inline-grid; place-items: center; width: var(--size); height: var(--size); flex: none; border-radius: 50%; color: #fff; font-size: 13px; font-weight: 600; background: #3e6fe6; }
.avatar[data-size=lg] { --size: 38px; font-size: 15px; }
.avatar[data-hue="1"] { background: #8a64d8; }
.avatar[data-hue="2"] { background: #23907a; }
.avatar[data-hue="3"] { background: #c97f2e; }
.avatar[data-hue="4"] { background: #2f8fcf; }
.avatar[data-hue="5"] { background: #7c8698; }

/* ---- app frame: sidebar on the canvas, content as one clear surface ------------- */
.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100vh; }
.sidebar { position: sticky; top: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 12px; padding: 18px 12px 14px 16px; }
.brand { display: flex; align-items: center; gap: 9px; padding: 2px 6px 6px; }
.brand-name { font-family: var(--font-display); font-size: 17px; font-weight: 680; letter-spacing: -.01em; }
.brand-tag { padding: 1px 7px; border-radius: 999px; background: var(--fill); color: var(--ink-3); font-size: 11.5px; font-weight: 600; }
.nav-close { display: none; margin-left: auto; }
.space-switch, .account-chip { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: 12px; text-align: left; cursor: pointer; transition: background-color .15s; }
.space-switch { background: var(--surface); box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(20, 27, 38, .05); }
.space-switch:hover { background: color-mix(in srgb, var(--surface) 70%, var(--surface-3)); }
.account-chip { background: transparent; }
.account-chip:hover { background: var(--hover); }
.space-switch:focus-visible, .account-chip:focus-visible { outline: none; box-shadow: var(--focus); }
.space-switch > .icon, .account-chip > .icon { width: 16px; height: 16px; color: var(--ink-3); margin-left: auto; }
.space-glyph { display: grid; place-items: center; width: 32px; height: 32px; flex: none; border-radius: 9px; background: var(--accent-soft-2); color: var(--accent-ink); font-weight: 650; }
.space-glyph.large { width: 46px; height: 46px; border-radius: 13px; font-size: 19px; }
.space-text, .account-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.35; }
.space-text strong, .account-text strong { font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.space-text small, .account-text small { font-size: 12px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav { display: flex; flex-direction: column; gap: 1px; overflow-y: auto; margin: 0 -4px; padding: 0 4px; }
.nav-label { margin: 14px 10px 4px; font-size: 11.5px; font-weight: 600; color: var(--ink-3); letter-spacing: .04em; }
.nav-item { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 34px; padding: 0 10px; border: 0; border-radius: 9px; background: transparent; color: var(--ink-2); font-size: 14px; font-weight: 500; text-decoration: none; cursor: pointer; transition: background-color .15s, color .15s; }
.nav-item .icon { color: var(--ink-3); }
.nav-item:hover { background: var(--hover); color: var(--ink); }
.nav-item:focus-visible { outline: none; box-shadow: var(--focus); }
.nav-item[aria-current=page] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(20, 27, 38, .06); }
.nav-item[aria-current=page] .icon { color: var(--accent); }
.sidebar-foot { margin-top: auto; display: flex; flex-direction: column; gap: 4px; padding-top: 10px; border-top: 1px solid var(--line); }

.main { min-width: 0; padding: 8px 8px 8px 0; }
.surface { position: relative; height: calc(100vh - 16px); height: calc(100dvh - 16px); overflow: auto; overscroll-behavior: contain; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow-surface); scroll-padding-top: 76px; }
.toolbar { position: sticky; top: 10px; z-index: 20; display: flex; align-items: center; gap: 6px; height: var(--toolbar); margin: 10px 12px 0; padding: 0 6px 0 14px; border-radius: 14px; }
.nav-open { display: none; }
.crumbs { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 13.5px; }
.crumb-space { color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumb-page { font-weight: 600; white-space: nowrap; }
.crumb-sep { width: 14px; height: 14px; color: var(--ink-3); }
.toolbar-actions { margin-left: auto; display: flex; gap: 4px; }
.page { padding: 20px 28px 88px; outline: none; }
.page-inner { max-width: 1180px; margin: 0 auto; }
.page-inner.narrow { max-width: 820px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin: 8px 0 22px; }
.page-head h1 { margin: 0; font-family: var(--font-display); font-size: 26px; line-height: 1.25; font-weight: 680; letter-spacing: -.012em; outline: none; }
.page-desc { margin: 6px 0 0; max-width: 66ch; color: var(--ink-2); }
.page-actions { display: flex; gap: 8px; flex: none; }
.page-alert:not(:empty) { margin: 0 auto 14px; max-width: 1180px; }
.loading { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 72px 24px; color: var(--ink-3); }
.spinner { width: 16px; height: 16px; border: 2px solid var(--line-2); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
.scrim { position: fixed; inset: 0; z-index: 30; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .2s var(--ease); }

/* ---- list + inspector -------------------------------------------------------------- */
.split { display: grid; grid-template-columns: minmax(0, 1fr) 0; align-items: start; transition: grid-template-columns .26s var(--ease), gap .26s var(--ease); }
.split[data-open=true] { grid-template-columns: minmax(0, 1fr) min(500px, 44%); gap: 22px; }
.split-list { min-width: 0; container: list / inline-size; }
.panel { position: sticky; top: calc(var(--toolbar) + 20px); max-height: calc(100vh - var(--toolbar) - 44px); max-height: calc(100dvh - var(--toolbar) - 44px); overflow: auto; overscroll-behavior: contain; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow-panel); outline: none; container: panel / inline-size; animation: panel-in .26s var(--ease); }
.panel-inner { display: flex; flex-direction: column; gap: 16px; padding: 0 20px 72px; }
.panel-head { position: sticky; top: 0; z-index: 3; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin: 0 -20px; padding: 16px 20px 12px; background: color-mix(in srgb, var(--surface) 88%, transparent); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-bottom: 1px solid var(--line); }
.panel-heading { min-width: 0; }
.panel-heading h2 { margin: 0; font-family: var(--font-display); font-size: 19px; line-height: 1.3; font-weight: 680; outline: none; overflow-wrap: anywhere; }
.panel-eyebrow { margin: 0 0 2px; font-size: 12px; color: var(--ink-3); }
.panel-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 8px; font-size: 12.5px; color: var(--ink-3); }
.panel-tools { display: flex; align-items: center; gap: 4px; flex: none; }
.panel-section { display: flex; flex-direction: column; gap: 10px; padding-top: 16px; border-top: 1px solid var(--line); }
.panel-section > .btn { align-self: flex-start; }
.panel-head + .panel-section, .panel-head + .banner + .panel-section { border-top: 0; padding-top: 2px; }
.section-title { margin: 0; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.section-lead { margin: 0; color: var(--ink-2); font-size: 13.5px; line-height: 1.65; }

.toolbar-row { display: flex; align-items: center; justify-content: space-between; gap: 10px 12px; flex-wrap: wrap; margin-bottom: 12px; }
.toolbar-row-end { display: flex; align-items: center; gap: 8px; }
.find { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 9px; background: var(--fill); color: var(--ink-3); }
.find .icon { width: 15px; height: 15px; }
.find:focus-within { box-shadow: var(--focus); }
.find input.find-input[type=search] { width: 112px; height: 28px; padding: 0; border: 0; background: transparent; box-shadow: none; font-size: 13px; color: var(--ink); }
.find input.find-input[type=search]:focus { outline: none; box-shadow: none; border: 0; background: transparent; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px; margin: -2px; }
.chips::-webkit-scrollbar { display: none; }
.chips button { display: inline-flex; align-items: center; height: 30px; padding: 0 12px; border: 0; border-radius: 999px; background: var(--fill); color: var(--ink-2); font-size: 13px; font-weight: 500; white-space: nowrap; cursor: pointer; transition: background-color .15s, color .15s; }
.chips button:hover { background: var(--fill-2); color: var(--ink); }
.chips button[aria-checked=true] { background: var(--accent-soft-2); color: var(--accent-ink); font-weight: 600; }
.chips button:focus-visible { outline: none; box-shadow: var(--focus); }
.tokens { display: flex; flex-wrap: wrap; gap: 6px; margin: -2px 0 12px; }
.token { display: inline-flex; align-items: center; gap: 2px; height: 26px; padding: 0 3px 0 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink); font-size: 12.5px; }
.list-meta { display: flex; justify-content: space-between; gap: 12px; padding: 0 12px 6px; font-size: 12.5px; color: var(--ink-3); }
.list-note { margin: 0 12px 8px; font-size: 12.5px; color: var(--ink-3); }
.pager { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 16px 12px 0; }
.pager-text { margin-right: auto; font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

.rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.row { position: relative; display: grid; grid-template-columns: 34px minmax(0, 1fr) 16px; gap: 12px; align-items: start; width: 100%; padding: 12px; border: 0; border-radius: 12px; background: transparent; text-align: left; cursor: pointer; transition: background-color .15s; }
.row:hover { background: var(--hover); }
.row:focus-visible { outline: none; box-shadow: var(--focus); }
.row[data-opened=true] { background: var(--accent-soft); }
.row[data-opened=true]::before { content: ""; position: absolute; left: 3px; top: 14px; bottom: 14px; width: 3px; border-radius: 3px; background: var(--accent); }
.row-icon { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; background: var(--tone-soft, var(--fill)); color: var(--tone, var(--ink-2)); }
.row-icon .icon { width: 19px; height: 19px; }
.row-main { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.row-top { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.row-title { font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-status { font-size: 12.5px; font-weight: 600; color: var(--tone); white-space: nowrap; }
.row-version { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); }
.row-time, .row-aside { margin-left: auto; padding-left: 8px; font-size: 12.5px; color: var(--ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.row-text { color: var(--ink-2); font-size: 13.5px; line-height: 1.55; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-text[data-tone=muted] { color: var(--ink-3); }
.row-text[data-tone=warn], .row-text[data-tone=unknown], .row-text[data-tone=danger] { color: var(--tone); font-weight: 500; }
.row-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 3px; font-size: 12.5px; color: var(--ink-3); }
.row-go { width: 16px; height: 16px; margin-top: 9px; color: var(--ink-3); opacity: 0; transition: opacity .15s; }
.row:hover .row-go, .row:focus-visible .row-go, .row[data-opened=true] .row-go { opacity: 1; }

.rows-table, .list-head { --cols: 34px minmax(0, 1.6fr) minmax(0, 1fr) minmax(0, 1.1fr) minmax(0, .8fr) 16px; }
.list-head { display: grid; grid-template-columns: var(--cols); gap: 12px; padding: 0 12px 8px; margin-bottom: 4px; border-bottom: 1px solid var(--line); font-size: 12px; font-weight: 500; color: var(--ink-3); }
.rows-table .row { grid-template-columns: var(--cols); align-items: center; }
.rows-table .row-go { margin-top: 0; }
.cell { min-width: 0; font-size: 13.5px; color: var(--ink-2); }
.cell[data-tone=muted] { color: var(--ink-3); }
.cell[data-tone=warn] { color: var(--warn); font-weight: 500; }
.cell-name { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
.cell-name small { font-size: 12.5px; color: var(--ink-3); }
.cell-muted { color: var(--ink-3); font-size: 13px; }
@container list (max-width: 640px) {
  .list-head { display: none; }
  .rows-table .row { grid-template-columns: 34px minmax(0, 1fr) auto 16px; }
  .rows-table .cell[data-priority=low] { display: none; }
}

/* Relation thread used in rows: a short dashed weft between nodes. */
.chain { display: inline-flex; align-items: center; flex-wrap: wrap; row-gap: 2px; min-width: 0; }
.chain-node { white-space: nowrap; }
.chain-step { display: inline-flex; align-items: center; white-space: nowrap; }
.chain-link { position: relative; display: inline-block; width: 16px; height: 8px; margin: 0 5px; color: var(--thread-quiet); background: repeating-linear-gradient(90deg, currentColor 0 3px, transparent 3px 5px) center / 100% 1.5px no-repeat; }
.chain-link::after { content: ""; position: absolute; right: -1px; top: 50%; width: 4px; height: 4px; border-top: 1.5px solid currentColor; border-right: 1.5px solid currentColor; transform: translateY(-50%) rotate(45deg); }

/* Signature: rounds woven along one weft thread. */
.weft-wrap { margin: 0 -6px; overflow-x: auto; scrollbar-width: thin; }
.weft { display: flex; list-style: none; margin: 0; padding: 2px; min-width: max-content; }
.weft-node { position: relative; flex: 0 0 104px; }
.weft-node:not(:first-child)::before {
  content: ""; position: absolute; top: 19px; left: calc(-50% + 18px); right: calc(50% + 18px); height: 5px;
  background:
    repeating-linear-gradient(90deg, var(--seg, var(--thread-quiet)) 0 6px, transparent 6px 10px) 0 0 / 100% 1.6px no-repeat,
    repeating-linear-gradient(90deg, transparent 0 5px, var(--seg, var(--thread-quiet)) 5px 10px) 0 3.4px / 100% 1.6px no-repeat;
}
.weft-node[data-tone=ok]:not(:first-child)::before, .weft-node[data-current=true]:not(:first-child)::before { --seg: var(--thread); }
.weft-node button { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; padding: 4px 6px 6px; border: 0; border-radius: 12px; background: transparent; cursor: pointer; }
.weft-node button:hover { background: var(--hover); }
.weft-node button:focus-visible { outline: none; box-shadow: var(--focus); }
.knot { position: relative; z-index: 1; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--surface); border: 1.6px solid var(--tone, var(--line-2)); color: var(--tone, var(--ink-2)); font-size: 12.5px; font-weight: 650; font-variant-numeric: tabular-nums; transition: background-color .2s, box-shadow .2s; }
.weft-node[data-tone=accent] .knot { border-style: dashed; }
.weft-node[data-current=true] .knot { background: var(--accent-fill); border: 1.6px solid var(--accent-fill); color: #fff; box-shadow: 0 0 0 4px var(--accent-soft); }
.weft-label { display: flex; flex-direction: column; align-items: center; line-height: 1.35; }
.weft-label strong { font-size: 12.5px; font-weight: 600; }
.weft-label small { font-size: 12px; color: var(--ink-3); }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs [role=tab] { flex: none; padding: 8px 10px 9px; margin-bottom: -1px; border: 0; border-bottom: 2px solid transparent; border-radius: 8px 8px 0 0; background: transparent; color: var(--ink-2); font-size: 13.5px; font-weight: 500; cursor: pointer; }
.tabs [role=tab]:hover { color: var(--ink); background: var(--hover); }
.tabs [role=tab][aria-selected=true] { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
.tabs [role=tab]:focus-visible { outline: none; box-shadow: var(--focus); }
.tabpanel { display: flex; flex-direction: column; gap: 14px; outline: none; }
.tabpanel:focus-visible { box-shadow: var(--focus); border-radius: 8px; }

/* Reading: report text is the "document" of this product. */
.digest { display: grid; grid-template-columns: 1fr; gap: 8px; }
@container panel (min-width: 520px) { .digest { grid-template-columns: 1fr 1fr; } }
.digest-item { padding: 12px 14px; border-radius: 12px; background: var(--surface-2); }
.digest-item h4, .reading-title { margin: 0 0 4px; font-size: 12.5px; font-weight: 600; color: var(--ink-3); }
.digest-item p { margin: 0; white-space: pre-wrap; line-height: 1.65; }
.reading { display: flex; flex-direction: column; gap: 6px; }
.report-text { max-width: 68ch; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; line-height: 1.85; color: var(--ink); border-radius: 8px; outline: none; }
.report-text:focus-visible { box-shadow: var(--focus); }
.report-text.compact { margin: 0 12px 12px; padding: 10px 12px; max-height: 180px; overflow: auto; font-size: 13.5px; line-height: 1.7; color: var(--ink-2); background: var(--surface); border-radius: 10px; }

.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 18px; margin: 0; }
.fact { display: contents; }
.facts dt { color: var(--ink-3); font-size: 13px; line-height: 1.6; }
.facts dd { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0; min-width: 0; font-size: 13.5px; line-height: 1.6; overflow-wrap: anywhere; }
.facts.compact { gap: 4px 14px; }
.facts.compact dt { font-size: 12px; }
.facts.compact dd { font-size: 12.5px; }

.banner { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 12px 14px; border-radius: 12px; background: var(--tone-soft, var(--fill)); }
.banner > .icon { width: 20px; height: 20px; margin-top: 1px; color: var(--tone, var(--ink-2)); stroke-width: 1.8; }
.banner-text { min-width: 0; }
.banner-text strong { display: block; font-size: 14px; font-weight: 600; line-height: 1.5; }
.banner-text p { margin: 2px 0 0; color: var(--ink-2); font-size: 13.5px; line-height: 1.6; }
.banner-actions { display: flex; align-items: center; gap: 4px; }

.empty { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 56px 24px; text-align: center; }
.empty-glyph { display: grid; place-items: center; width: 56px; height: 56px; margin-bottom: 6px; border-radius: 18px; border: 1px dashed var(--line-2); background: var(--surface-2); color: var(--tone, var(--ink-3)); }
.empty-glyph .icon { width: 26px; height: 26px; stroke-width: 1.5; }
.empty h3 { margin: 0; font-size: 16px; font-weight: 600; }
.empty p { margin: 0; max-width: 46ch; color: var(--ink-2); }
.empty-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 10px; }
.panel .empty { padding: 28px 12px; }

/* ---- forms ---------------------------------------------------------------------- */
.form { display: flex; flex-direction: column; gap: 14px; }
.form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
.form-actions.stretch > .btn { flex: 1; }
.form-actions.sticky { position: sticky; bottom: -24px; margin: 0 -20px -24px; padding: 12px 20px 20px; background: linear-gradient(transparent, var(--surface) 28%); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field-label { margin: 0; font-size: 13px; font-weight: 500; color: var(--ink-2); }
.field-hint { margin: 0; font-size: 12.5px; line-height: 1.55; color: var(--ink-3); }
input:not([type=checkbox]):not([type=radio]), select, textarea { width: 100%; min-width: 0; height: 38px; padding: 0 12px; border: 1px solid var(--field-line); border-radius: 10px; background: var(--field); color: var(--ink); font-size: 14px; transition: border-color .15s, box-shadow .15s, background-color .15s; }
textarea { height: auto; padding: 10px 12px; line-height: 1.65; resize: vertical; }
input:not([type=checkbox]):not([type=radio]):focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 3px var(--accent-soft-2); }
input:disabled, select:disabled { opacity: .6; }
::placeholder { color: var(--ink-3); opacity: 1; }
.mono-input { font-family: var(--font-mono); font-size: 13px; }
.select { position: relative; }
.select select { appearance: none; padding-right: 34px; }
.select > .icon { position: absolute; right: 10px; top: 50%; width: 16px; height: 16px; translate: 0 -50%; color: var(--ink-3); pointer-events: none; }
.password { display: flex; gap: 6px; }
.password input { flex: 1; }
.password .reveal { flex: none; height: 38px; }
.inline-edit { display: flex; align-items: center; gap: 6px; min-height: 32px; }
.inline-value { font-size: 14.5px; font-weight: 500; }
.inline-form { display: flex; flex-direction: column; gap: 8px; width: 100%; }
.inline-actions { display: flex; justify-content: flex-end; gap: 6px; }
.inline-add { flex-direction: row; align-items: flex-end; flex-wrap: wrap; }
.inline-add .field { flex: 1 1 220px; }
.inline-add .form-actions { margin: 0; }
.popover-form { width: 100%; }
.member-choices { display: flex; flex-direction: column; gap: 4px; margin: 0; padding: 0; border: 0; }
.member-choices legend { margin-bottom: 6px; font-size: 13px; font-weight: 500; color: var(--ink-2); }
.check { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); cursor: pointer; }
.check small { margin-left: auto; color: var(--ink-3); }
.check input { width: 18px; height: 18px; accent-color: var(--accent-fill); }

.switch-list { display: flex; flex-direction: column; gap: 2px; padding: 4px; border-radius: 12px; background: var(--surface-2); }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 9px 10px; border-radius: 10px; }
.panel-section > .switch-row { background: var(--surface-2); padding: 12px 14px; border-radius: 12px; }
.switch-text { display: flex; flex-direction: column; min-width: 0; }
.switch-label { font-size: 14px; font-weight: 500; }
.switch-desc { font-size: 12.5px; color: var(--ink-3); line-height: 1.5; }
.switch { position: relative; flex: none; width: 42px; height: 26px; padding: 0; border: 0; border-radius: 999px; background: var(--switch-off); cursor: pointer; transition: background-color .2s var(--ease); }
.switch-thumb { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .28); transition: transform .22s var(--ease); }
.switch[aria-checked=true] { background: var(--accent-fill); }
.switch[aria-checked=true] .switch-thumb { transform: translateX(16px); }
.switch:disabled { opacity: .45; cursor: not-allowed; }
.switch:focus-visible { outline: none; box-shadow: var(--focus); }

.segmented { display: inline-flex; gap: 2px; padding: 3px; border-radius: 11px; background: var(--fill); }
.segmented button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 30px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: var(--ink-2); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.segmented button .icon { width: 15px; height: 15px; }
.segmented button:hover { color: var(--ink); }
.segmented button[aria-checked=true] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 .5px var(--line-2), 0 1px 2px rgba(20, 27, 38, .12); }
.segmented button:focus-visible { outline: none; box-shadow: var(--focus); }
.segmented.stacked { display: flex; flex-direction: column; }
.segmented.stacked button { justify-content: flex-start; }

/* ---- floating layer: menus, popovers, dialogs, toasts ----------------------------- */
.menu, .popover, .demo-panel { position: fixed; z-index: 60; border-radius: 16px; animation: pop .16s var(--ease); }
.menu { min-width: 230px; max-width: min(320px, calc(100vw - 16px)); padding: 6px; }
.popover { width: min(320px, calc(100vw - 16px)); padding: 14px; }
.menu-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: 10px; background: transparent; color: var(--ink); font-size: 13.5px; text-align: left; cursor: pointer; }
.menu-item:hover, .menu-item:focus-visible { background: var(--menu-hover); outline: none; }
.menu-item:disabled { opacity: .5; cursor: default; }
.menu-item .icon { width: 16px; height: 16px; color: var(--ink-3); }
.menu-item[data-tone=danger], .menu-item[data-tone=danger] .icon { color: var(--danger); }
.menu-item .menu-check { color: var(--accent); }
.icon-space { width: 16px; flex: none; }
.menu-text { display: flex; flex-direction: column; flex: 1; min-width: 0; line-height: 1.4; }
.menu-text small { font-size: 12px; color: var(--ink-3); }
.menu-sep { height: 1px; margin: 6px 6px; background: var(--line); }
.menu-label { padding: 6px 10px 4px; font-size: 12px; font-weight: 600; color: var(--ink-3); }
.menu-profile { display: flex; align-items: center; gap: 10px; padding: 8px 10px; }
.menu-profile strong { display: block; font-size: 14px; }
.menu-profile .mono { font-size: 12px; color: var(--ink-3); }

dialog.dialog { width: min(520px, calc(100vw - 32px)); max-height: min(86vh, 780px); padding: 0; border: 0; border-radius: 22px; background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sheet); }
dialog.dialog[open] { display: flex; flex-direction: column; animation: dialog-in .22s var(--ease); }
dialog.dialog[data-size=sm] { width: min(420px, calc(100vw - 32px)); }
dialog::backdrop { background: var(--scrim); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.dialog-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 22px 22px 0; }
.dialog-head h2 { margin: 0; font-family: var(--font-display); font-size: 19px; font-weight: 680; line-height: 1.35; }
.dialog-desc { margin: 6px 0 0; color: var(--ink-2); font-size: 13.5px; line-height: 1.65; }
.dialog-close { margin: -4px -6px 0 0; }
.dialog-body { display: flex; flex-direction: column; gap: 14px; padding: 16px 22px 22px; overflow: auto; }
.dialog-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 0 22px 22px; }
.prompt { margin: 0; padding: 14px 16px; border-radius: 12px; background: var(--surface-2); white-space: pre-wrap; overflow-wrap: anywhere; font: 14px/1.75 var(--font); color: var(--ink); }
.prompt:focus-visible { outline: none; box-shadow: var(--focus); }
.code-block { margin: 0 12px 12px; padding: 12px; max-height: 280px; overflow: auto; border-radius: 10px; background: var(--surface); font: 12.5px/1.6 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.secret { display: flex; flex-direction: column; gap: 6px; }
.secret-value { margin: 0; padding: 14px; border-radius: 12px; background: var(--accent-soft); color: var(--accent-ink); font: 600 14px/1.5 var(--font-mono); word-break: break-all; white-space: pre-wrap; }
.secret-value:focus-visible { outline: none; box-shadow: var(--focus); }
.native-preview { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 14px; background: var(--surface-2); }
.native-preview > .icon { width: 22px; height: 22px; color: var(--accent); }
.native-preview strong { display: block; font-size: 14px; }
.native-preview .mono { font-size: 12px; color: var(--ink-3); }

.toast-region { position: fixed; left: 50%; bottom: 22px; z-index: 90; display: flex; flex-direction: column; align-items: center; gap: 8px; translate: -50% 0; pointer-events: none; }
.toast { display: flex; align-items: center; gap: 8px; max-width: min(460px, calc(100vw - 32px)); padding: 10px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 500; animation: toast-in .22s var(--ease); transition: opacity .3s, transform .3s; }
.toast .icon { width: 17px; height: 17px; color: var(--ok); stroke-width: 2; }
.toast[data-tone=info] .icon { color: var(--accent); }
.toast[data-tone=warn] .icon { color: var(--warn); }
.toast.leaving { opacity: 0; transform: translateY(6px); }

.demo-pill { position: fixed; right: 16px; bottom: 16px; z-index: 70; display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px; border-radius: 999px; color: var(--ink); font-size: 13px; font-weight: 600; cursor: pointer; }
.demo-pill .icon { width: 16px; height: 16px; color: var(--accent); }
.demo-pill[data-changed=true]::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
.demo-pill:focus-visible { outline: none; box-shadow: var(--focus); }
.demo-panel { width: min(300px, calc(100vw - 16px)); max-height: calc(100vh - 80px); overflow: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
.demo-head strong { display: block; font-size: 14px; }
.demo-head span { font-size: 12px; color: var(--ink-3); }
.demo-title { margin: 0 0 6px; font-size: 12px; font-weight: 600; color: var(--ink-3); }
.demo-group .segmented:not(.stacked) { display: flex; }

/* ---- page parts ------------------------------------------------------------------ */

.line-list { list-style: none; margin: 0; padding: 0; }
.line { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--line); }

.file-list, .alias-list, .tool-list { list-style: none; margin: 0; padding: 4px; display: flex; flex-direction: column; gap: 2px; border-radius: 12px; background: var(--surface-2); outline: none; }

.file-list .icon, .alias-list .icon { width: 16px; height: 16px; color: var(--ink-3); }
.tool-list .icon { width: 17px; height: 17px; color: var(--ok); }

.command { display: inline-block; padding: 3px 8px; border-radius: 6px; background: var(--surface); font: 12.5px/1.5 var(--font-mono); overflow-wrap: anywhere; }
.disclosure { border-radius: 12px; background: var(--surface-2); }
.disclosure summary { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; font-size: 13.5px; font-weight: 500; list-style: none; cursor: pointer; }
.disclosure summary::-webkit-details-marker { display: none; }
.disclosure summary::before { content: ""; width: 6px; height: 6px; flex: none; border-right: 1.6px solid var(--ink-3); border-bottom: 1.6px solid var(--ink-3); transform: rotate(-45deg); transition: transform .18s var(--ease); }

.versions { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }

.order { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; padding: 14px 16px; border-radius: 16px; background: var(--surface-2); }

/* ---- account route ---------------------------------------------------------------- */
.auth { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; padding: 22px 28px 56px; background: radial-gradient(900px 540px at 88% 6%, var(--wash-1), transparent 62%), radial-gradient(760px 520px at 6% 96%, var(--wash-2), transparent 60%), var(--canvas); }

.steps li[data-done=true] { color: var(--ink); }

/* ---- motion ---------------------------------------------------------------------- */
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.98); } }
@keyframes panel-in { from { opacity: 0; transform: translateX(10px); } }
@keyframes sheet-in { from { opacity: 0; transform: translateX(28px); } }
@keyframes dialog-in { from { opacity: 0; transform: translateY(8px) scale(.985); } }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}

/* ---- tablet: inspector becomes a sheet over the list ------------------------------- */

  body[data-nav=open] .sidebar { transform: none; visibility: visible; transition: transform .28s var(--ease); }

  .surface { height: auto; min-height: 100vh; min-height: 100dvh; overflow: visible; border-radius: 0; box-shadow: none; }
  .toolbar { top: 8px; margin: 8px 8px 0; padding: 0 6px; }
  .nav-open { display: inline-flex; }
  .page { padding: 14px 16px 104px; }
  .page-head { flex-direction: column; align-items: stretch; gap: 12px; margin: 4px 0 18px; }

  .toolbar-row-end { width: 100%; }
  .find { flex: 1; }
