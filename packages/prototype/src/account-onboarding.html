<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Runweft · 账号与首次连接原型</title>
<style>
:root{color-scheme:light;--bg:#f3f6fa;--surface:#fff;--ink:#213148;--muted:#53657e;--line:#d8e1ed;--blue:#245ac7;--warn:#a15b00}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 system-ui,"PingFang SC",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:5px;background:white;color:var(--ink);padding:9px 14px}button:hover{border-color:var(--blue)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #83a9f0;outline-offset:3px}.primary{background:var(--blue);color:white;border-color:var(--blue)}.link{border:0;padding:2px;color:var(--blue);background:none}.muted{color:var(--muted)}header{max-width:1120px;margin:auto;padding:26px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-size:21px;font-weight:700;letter-spacing:.02em}.demo{font-size:12px;color:var(--muted)}.toolbar{max-width:1072px;margin:0 auto 28px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px;border:1px solid var(--line);border-radius:8px}.toolbar button{padding:5px 10px;font-size:13px}.toolbar [aria-pressed=true]{border-color:var(--blue);color:var(--blue);background:#edf3ff}main{max-width:960px;margin:0 auto;padding:10px 24px 72px}.layout{display:grid;grid-template-columns:1fr 340px;gap:48px;align-items:start}.card{background:var(--surface);padding:30px;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 30px #21314806}h1{font:650 30px/1.3 "Avenir Next",system-ui,sans-serif;margin:8px 0 16px}h2{font-size:19px;margin:0 0 12px}p{margin:12px 0}.eyebrow{color:var(--blue);font-size:13px;letter-spacing:.04em}.intro{font-size:15px;color:var(--muted);margin-bottom:28px}label{display:block;font-weight:600;font-size:14px;margin:20px 0 7px}input,select{width:100%;min-width:0;border:1px solid #b7c5d9;border-radius:5px;padding:10px 12px;color:var(--ink);background:white}.password{display:flex;gap:8px}.password input{flex:1}.password button{white-space:nowrap;font-size:13px}.hint{font-size:12px;color:var(--muted);margin:6px 0 14px}.submit{width:100%;margin-top:20px;padding:12px}.switch{text-align:center;font-size:14px;margin:22px 0 0}.summary{margin-top:22px;border-top:1px solid var(--line);padding-top:20px}.summary dl{display:grid;grid-template-columns:72px 1fr;gap:10px;font-size:14px}.summary dt{color:var(--muted)}.summary dd{margin:0;overflow-wrap:anywhere}.code{font:600 19px/1.5 ui-monospace,monospace;letter-spacing:.14em}.steps{padding-left:22px;color:var(--muted);font-size:14px}.steps li{margin:13px 0}.success{color:#267255;font-size:14px;font-weight:600}.status{padding:12px 16px;border-left:3px solid var(--blue);background:#edf3ff;border-radius:4px;font-size:14px}.warning{border-color:var(--warn);background:#fff7e7}.row{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding:16px 0}.row:last-child{border:0}.row strong{display:block;font-size:14px}.row small{color:var(--muted)}.empty{padding:28px 0}.error{color:#a02b27;font-size:14px}#notice:empty{display:none}[hidden]{display:none!important}footer{font-size:12px;color:var(--muted);margin-top:24px}dialog{border:1px solid var(--line);border-radius:8px;max-width:440px;padding:28px}dialog::backdrop{background:#21314866}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}
@media(max-width:720px){header{padding:20px 16px}.demo{max-width:190px;text-align:right}.toolbar{margin:0 16px 22px}.layout{grid-template-columns:1fr;gap:26px}main{padding:0 16px 40px}.card{padding:24px}h1{font-size:27px}.context{order:-1}.context .steps,.context>h2,.context>p{display:none}.context .summary{margin-top:0;padding-top:0;border:0}.row{align-items:flex-start;flex-wrap:wrap}}
</style>
<header><span class="brand">runweft<span style="color:var(--blue)"> /</span></span><span class="demo">交互演示 · 仅内存示例，请勿输入真实密码</span></header>
<nav class="toolbar" aria-label="演示场景"><span class="demo">查看场景</span><button data-scene="register" aria-pressed="true">首次注册</button><button data-scene="login">已有账号</button><button data-scene="expired">请求过期</button><button data-scene="recover">忘记密码</button><button data-scene="settings">账号设置</button><button data-scene="workspace">首次工作台</button></nav>
<main><div class="layout"><section class="card" id="content" aria-label="账号与连接"></section><aside class="context"><h2>让 Agent 继续完成接入</h2><p class="muted">核对并授权当前工作环境，接下来回到原对话即可。</p><div class="summary"><dl><dt>Hub</dt><dd>localhost:3210</dd><dt>工作环境</dt><dd>我的开发电脑</dd><dt>核对码</dt><dd class="code">8F2C 61A9</dd></dl><p class="hint">请与 Agent 给出的地址、设备和核对码核对。</p></div><ol class="steps"><li>用账号登录并授权这个环境</li><li>Agent 准备机器和执行工具</li><li>在原对话读到第一份评审报告</li></ol><footer>此命令行环境能以你的账号访问有权使用的资源。你可以随时在账号设置中断开它。</footer></aside></div><p id="notice" role="status" aria-live="polite"></p></main>
<dialog id="confirm"><h2>断开这个登录环境？</h2><p>这个环境将无法继续访问你的账号，已接受的任务会继续执行。</p><div class="actions"><button id="keep">保留</button><button class="primary" id="revoke">断开环境</button></div></dialog>
<script>
const content=document.querySelector('#content'),notice=document.querySelector('#notice');
let scene='register',username='lin',multi=false,revoked=false,fromReset=false;
const passwordField=(label='密码',name='password',autocomplete='current-password')=>`<label for="${name}">${label}</label><div class="password"><input id="${name}" name="${name}" type="password" required minlength="15" maxlength="256" autocomplete="${autocomplete}" aria-describedby="${name}-hint"><button type="button" data-toggle="${name}" aria-label="显示${label}">显示</button></div><p class="hint" id="${name}-hint">至少 15 个字符，可使用长句、空格和密码管理器。</p>`;
function render(){
 notice.textContent='';document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scene===scene)));
 if(scene==='register'||scene==='login'){
  const isNew=scene==='register';
  content.innerHTML=`<span class="eyebrow">连接你的工作环境</span><h1>${isNew?'第一次使用 Runweft':'欢迎回来'}</h1><p class="intro">${isNew?'创建账号并连接，Agent 会继续准备你的第一次体验。':'登录后，将当前工作环境连接到你的账号。'}</p>${fromReset?'<p class="status">密码已更新，请使用新密码登录。</p>':''}<form id="login-form"><label for="username">用户名</label><input id="username" name="username" autocomplete="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9]([A-Za-z0-9._]|-){2,31}" aria-describedby="username-hint"><p id="username-hint" class="hint">${isNew?'3–32 位字母、数字、点、下划线或短横线。':'使用你在这个 Hub 注册的用户名。'}</p>${passwordField('密码','password',isNew?'new-password':'current-password')}${multi&&!isNew?'<label for="space">默认工作空间</label><select id="space"><option>我的空间</option><option>产品团队</option></select>':''}<button class="primary submit" type="submit">${isNew?'注册并连接':'登录并连接'}</button></form>${!isNew?'<p><button class="link" data-scene="recover">忘记密码？</button></p>':''}<p class="switch">${isNew?'已有账号？':'还没有账号？'} <button class="link" data-scene="${isNew?'login':'register'}">${isNew?'登录':'注册'}</button></p><footer>${isNew?'显示名称默认使用用户名，并自动创建你的空间。':'仅退出当前浏览器不会断开已授权的命令行环境。'}</footer>${!isNew?'<p><button class="link" id="multi">'+(multi?'演示：切回单空间':'演示：多个空间')+'</button></p>':''}`;
  document.querySelector('#username').value=isNew?'':username;document.querySelector('#login-form').addEventListener('submit',e=>{e.preventDefault();username=document.querySelector('#username').value.trim().toLowerCase();scene='authorized';fromReset=false;render();});
 }else if(scene==='authorized'){
  content.innerHTML='<span class="success">✓ 已授权</span><h1>可以返回原对话了</h1><p class="intro">Agent 会继续完成接入，并把第一份评审报告带回原对话。无需再发送“已经点好”。</p><p class="status">此页面已完成账号授权。本机是否连接完成、执行工具是否就绪，由 Agent 核对后告诉你。</p><button class="submit" data-scene="workspace">查看工作台</button><footer>你也可以关闭这个标签页。</footer>';
 }else if(scene==='expired'){
  content.innerHTML='<span class="eyebrow">连接你的工作环境</span><h1>这个连接请求已过期</h1><p class="intro">请回到原对话，让 Agent 重新给出连接链接。已有账号会保留，不需要重新注册。</p><p class="status warning">本次请求尚未获得授权。</p><button class="submit" data-scene="login">前往账号登录</button>';
 }else if(scene==='recover'){
  content.innerHTML=`<span class="eyebrow">找回账号</span><h1>重置密码</h1><p class="intro">请联系这个 Hub 的部署者获取一次性重置码，再设置新密码。</p><form id="recover-form"><label for="username">用户名</label><input id="username" autocomplete="username" required><label for="reset-code">一次性重置码</label><input id="reset-code" type="password" autocomplete="off" required aria-describedby="reset-hint"><p class="hint" id="reset-hint">仅用于这次恢复，不需要长期保存。演示可输入 demo。</p>${passwordField('新密码','new-password','new-password')}<button class="primary submit" type="submit">重置密码</button></form><p><button class="link" data-scene="login">返回登录</button></p>`;
  document.querySelector('#username').value=username;document.querySelector('#recover-form').addEventListener('submit',e=>{e.preventDefault();username=document.querySelector('#username').value;scene='login';fromReset=true;render();});
 }else if(scene==='settings'){
  content.innerHTML=`<span class="eyebrow">账号设置 · lin</span><h1>管理登录环境</h1><p class="intro">断开某个环境只影响它的账号访问，Runner 和已接受的任务独立运行。</p><div class="row"><div><strong>当前浏览器</strong><small>当前标签 · 最近使用：现在</small></div><button id="logout">退出浏览器</button></div><div class="row"><div><strong>我的开发电脑</strong><small>${revoked?'命令行 · 已断开':'命令行 · 最近使用：刚刚'}</small></div>${revoked?'<span class="muted">已断开</span>':'<button id="disconnect">断开环境</button>'}</div><div class="summary"><h2>修改密码</h2><form id="password-form">${passwordField('当前密码','old-password')}${passwordField('新密码','new-password','new-password')}<button class="primary submit" type="submit">修改密码并退出全部环境</button></form><p class="hint">修改密码后，所有浏览器和命令行都需要重新登录。</p><button class="link" id="logout-all">退出全部环境</button></div>`;
  document.querySelector('#password-form').addEventListener('submit',e=>{e.preventDefault();scene='login';fromReset=true;render();});
 }else if(scene==='all-out'){
  content.innerHTML=`<h1>退出全部环境</h1><p class="intro">请输入当前密码。已接受的任务会继续执行。</p><form id="all-form">${passwordField('当前密码','old-password')}<button class="primary submit" type="submit">确认退出全部环境</button></form><p><button class="link" data-scene="settings">返回账号设置</button></p>`;document.querySelector('#all-form').addEventListener('submit',e=>{e.preventDefault();scene='login';render();notice.textContent='所有浏览器与命令行登录已退出（演示）。';});
 }else{
  content.innerHTML='<span class="eyebrow">我的空间</span><h1>你的第一个任务即将从这里开始</h1><p class="intro">Agent 会在原对话准备执行环境并发起评审。任务接受后，你可以在这里查看进展和结果。</p><div class="empty"><h2>还没有任务</h2><p class="muted">已完成授权的话，请返回原对话继续体验。</p></div><button data-scene="settings">账号设置</button>';
 }
}
document.addEventListener('click',event=>{
 const b=event.target.closest('button');if(!b)return;
 if(b.dataset.scene){scene=b.dataset.scene;fromReset=false;render();content.querySelector('h1').setAttribute('tabindex','-1');content.querySelector('h1').focus();}
 if(b.dataset.toggle){const field=document.getElementById(b.dataset.toggle);field.type=field.type==='password'?'text':'password';b.textContent=field.type==='password'?'显示':'隐藏';b.setAttribute('aria-label',(field.type==='password'?'显示':'隐藏')+document.querySelector(`label[for="${field.id}"]`).textContent);}
 if(b.id==='multi'){multi=!multi;render();}
 if(b.id==='disconnect')document.querySelector('#confirm').showModal();
 if(b.id==='keep')document.querySelector('#confirm').close();
 if(b.id==='revoke'){revoked=true;document.querySelector('#confirm').close();render();notice.textContent='已断开我的开发电脑（演示）。';}
 if(b.id==='logout'){scene='login';render();}
 if(b.id==='logout-all'){scene='all-out';render();}
});
// Keep the browser's field validation inside an opaque preview iframe.
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b?.type==='submit'&&b.form){e.preventDefault();if(b.form.reportValidity())b.form.dispatchEvent(new SubmitEvent('submit',{bubbles:true,cancelable:true,submitter:b}));}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&e.target.tagName==='INPUT'&&e.target.form){e.preventDefault();const f=e.target.form;if(f.reportValidity())f.dispatchEvent(new SubmitEvent('submit',{bubbles:true,cancelable:true}));}});
window.addEventListener('message',event=>{if(event.data?.type==='openfolio:preview:init')event.source?.postMessage({type:'openfolio:preview:ready',status:'ready',version:'local-preview',requestId:event.data.requestId},'*');});
render();document.body.dataset.ready='true';
</script>
</html>
